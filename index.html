<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amoura - Connections, Not Just Swipes</title>
<meta name="description" content="Amoura is a dating app for real conversations. Join the waitlist.">
<style>
:root{--ink:#1f1630;--muted:#625a72;--bg:#fbf8fb;--red:#d6204f;--purple:#6a3fd1;--line:#e9e2ee;--grad:linear-gradient(135deg,#e8203f,#b52a9c 55%,#6a3fd1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--bg);line-height:1.6}
h1,h2,h3,.logo,.btn,nav a,label,input,button{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(251,248,251,.94);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-weight:700;font-size:1.4rem;color:var(--red);text-decoration:none}
nav{display:flex;gap:22px}
nav a{text-decoration:none;color:var(--muted);font-size:.95rem}
nav a:hover{color:var(--ink)}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;color:#fff;background:var(--grad);padding:12px 24px;border-radius:999px;font-weight:700;font-size:1rem}
.btn:hover{opacity:.92}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:72px 0}
h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;margin-bottom:18px}
.hero p{color:var(--muted);font-size:1.15rem;max-width:34em;margin-bottom:26px}
.phone{background:var(--grad);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(106,63,209,.25)}
.msg{max-width:80%;padding:11px 16px;border-radius:18px;font-family:"Trebuchet MS",Arial,sans-serif;font-size:.95rem}
.them{background:#fff;color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:rgba(255,255,255,.22);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.note{color:#fff;font-size:.8rem;text-align:center;opacity:.85;font-family:"Trebuchet MS",Arial,sans-serif;margin-top:6px}
section{padding:64px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.6rem,3.5vw,2.2rem);margin-bottom:12px}
.lead{color:var(--muted);max-width:40em;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
h3{font-size:1.1rem;margin-bottom:6px}
.grid p{color:var(--muted);font-size:.98rem}
.steps li{margin-left:1.2em;margin-bottom:14px}
.steps strong{font-family:"Trebuchet MS",Arial,sans-serif}
.safety{background:#f3edf8}
.signup{text-align:center}
.signup .lead{margin-left:auto;margin-right:auto}
form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:520px;margin:0 auto}
